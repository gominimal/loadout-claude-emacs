# ~/.tmux.conf for Minimal sessions (loadout-claude-emacs)

set -s set-clipboard on        # copies reach the host clipboard via OSC 52
set -s extended-keys on        # Shift+Enter etc. in claude-code
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
set -g focus-events on         # claude-code
set -g allow-passthrough on    # kittyview images
set -g mode-keys emacs
set -g history-limit 10000     # allow a long scrollback (lines)
# tmux-256color (not screen-256color) so Emacs runs terminal-init-tmux and
# xterm-tmux-extra-capabilities (OSC 52) applies.
set -g default-terminal "tmux-256color"

unbind C-b
set -g prefix C-o
bind C-o send-prefix
bind C-y paste-buffer
